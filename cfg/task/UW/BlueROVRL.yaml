# @package task
defaults:
  - /task/UW/BlueROVBase@_here_
  - _self_

name: BlueROVRL

num_envs: 4096

input:
  action:
    _target_: UnderwaterThrottle
    action_scaling: 1.0
    alpha_range: [0.5, 1.0]

command:
  _target_: Twist
  linvel_x_range: [-1.0, 1.6]
  linvel_y_range: [-0.8, 0.8]
  angvel_range: [-2.0, 2.0]
  yaw_stiffness_range: [0.5, 1.1]
  use_stiffness_ratio: 0.99
  resample_prob: 0.5
  stand_prob: 0.08
