task:
  name: BlueROV
  viewer:
    resolution:
    - 1280
    - 720
    lookat:
    - 0.0
    - 0.0
    - 0.0
    eye:
    - 4.0
    - 4.0
    - 4.0
  robot:
    name: bluerov
  terrain: plane
  num_envs: 1
  max_episode_length: 2000000000
  sim:
    step_dt: 0.02
    isaac_physics_dt: 0.005
    mujoco_physics_dt: 0.002
  input:
    action:
      _target_: UnderwaterThrottle
  command:
    _target_: Twist
    linvel_x_range:
    - -1.0
    - 1.6
    linvel_y_range:
    - -0.8
    - 0.8
    angvel_range:
    - -2.0
    - 2.0
    yaw_stiffness_range:
    - 0.5
    - 1.1
    use_stiffness_ratio: 0.99
    resample_prob: 0.5
    stand_prob: 0.08
  observation:
    policy:
      command: {}
      gravity_multistep:
        steps: 4
        noise_std: 0.05
      root_linvel_b:
        yaw_only: true
      root_angvel_b: {}
  reward:
    navi:
      survival:
        weight: 1.0
  termination:
    max_episode_length: {}
  record_video: ${..record_video}
headless: false
backend: isaac
device: cuda
app:
  headless: ${..headless}
  enable_cameras: ${..record_video}
seed: 42
record_video: false
realtime: true
print_interval: 100
output_dir: ''
controller:
  position_kp:
  - 0.7
  - 0.7
  - 0.8
  position_kd:
  - 2.0
  - 2.0
  - 2.2
  attitude_kp:
  - 8.0
  - 1.0
  - 12.0
  attitude_kd:
  - 3.0
  - 1.8
  - 3.0
  max_linear_acceleration:
  - 0.2
  - 0.2
  - 0.2
  max_angular_acceleration:
  - 1.5
  - 0.4
  - 2.0
  wrench_weights:
  - 1.0
  - 1.0
  - 1.0
  - 5.0
  - 0.5
  - 5.0
  control_pitch: false
  mass: 0.0
  inertia_diag:
  - 0.16
  - 0.25
  - 0.3
  use_added_mass: true
  compensate_hydrodynamics: false
target:
  mode: interactive
  prim_path: /World/BlueROVControlTarget
  initial_offset:
  - 1.0
  - 0.0
  - 0.0
  trajectory_duration: 4.0
  position_change_threshold: 0.002
  orientation_change_threshold_deg: 0.5
  max_duration: 0.0
  scripted_segment_duration: 6.0
  scripted_heave_offset: 0.5
  scripted_yaw_deg: 45.0
flow:
  enabled: false
  max_velocity:
  - 0.15
  - 0.08
  - 0.03
  - 0.0
  - 0.0
  - 0.0
  noise_std:
  - 0.02
  - 0.02
  - 0.01
  - 0.0
  - 0.0
  - 0.0
stability:
  center_of_buoyancy_offset: 0.06
  roll_linear_damping: 1.8
  pitch_linear_damping: 2.0
