task:
  name: BlueROV
  viewer:
    resolution:
    - 1280
    - 720
    lookat:
    - 0.0
    - 0.0
    - 0.0
    eye:
    - 4.0
    - 4.0
    - 4.0
  robot:
    name: bluerov
  terrain: plane
  num_envs: 1
  max_episode_length: 1200
  sim:
    step_dt: 0.02
    isaac_physics_dt: 0.005
    mujoco_physics_dt: 0.002
  input:
    action:
      _target_: UnderwaterThrottle
  command:
    _target_: Twist
    linvel_x_range:
    - -1.0
    - 1.6
    linvel_y_range:
    - -0.8
    - 0.8
    angvel_range:
    - -2.0
    - 2.0
    yaw_stiffness_range:
    - 0.5
    - 1.1
    use_stiffness_ratio: 0.99
    resample_prob: 0.5
    stand_prob: 0.08
  observation:
    policy:
      command: {}
      gravity_multistep:
        steps: 4
        noise_std: 0.05
      root_linvel_b:
        yaw_only: true
      root_angvel_b: {}
  reward:
    navi:
      survival:
        weight: 1.0
  termination:
    max_episode_length: {}
  record_video: ${..record_video}
headless: true
backend: isaac
device: cuda
app:
  headless: ${..headless}
  enable_cameras: ${..record_video}
seed: 42
record_video: false
realtime: false
segment_duration: 0.2
include_pitch_stress: false
surge_offset: 1.0
heave_offset: 0.5
yaw_target_deg: 45.0
pitch_target_deg: 15.0
print_interval: 10
output_dir: /tmp/bluerov-shared-model-smoke
controller:
  position_kp:
  - 1.0
  - 1.0
  - 1.0
  position_kd:
  - 1.8
  - 1.8
  - 1.8
  attitude_kp:
  - 1.5
  - 1.5
  - 1.5
  attitude_kd:
  - 1.2
  - 1.2
  - 1.2
  max_linear_acceleration:
  - 0.6
  - 0.6
  - 0.6
  max_angular_acceleration:
  - 0.8
  - 0.8
  - 0.8
  mass: 0.0
  inertia_diag: []
  use_added_mass: true
  compensate_hydrodynamics: true
