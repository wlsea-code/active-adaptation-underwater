hydra:
  run:
    dir: ./outputs_validation/${now:%Y-%m-%d}/${now:%H-%M-%S}-BlueROVPoseAction
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - headless=true
    - target.mode=scripted
    - target.scripted_segment_duration=1.0
    - realtime=false
    - flow.enabled=false
    - output_dir=/tmp/bluerov_pose_action_validation
  job:
    name: validate_bluerov_pose_action
    chdir: null
    override_dirname: flow.enabled=false,headless=true,output_dir=/tmp/bluerov_pose_action_validation,realtime=false,target.mode=scripted,target.scripted_segment_duration=1.0
    id: ???
    num: ???
    config_name: validate_bluerov_pose_action
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.3
    version_base: '1.3'
    cwd: /home/wlsea2/workspace/active-adaptation-dev-underwater
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/wlsea2/workspace/aa-projects/uderwater-control/cfg
      schema: file
      provider: main
    - path: /home/wlsea2/workspace/aa-projects/uderwater-control/cfg
      schema: file
      provider: aa_searchpath_plugin
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/wlsea2/workspace/active-adaptation-dev-underwater/outputs_validation/2026-07-17/11-33-06-BlueROVPoseAction
    choices:
      task: BlueROV1
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
